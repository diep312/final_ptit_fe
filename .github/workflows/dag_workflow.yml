name: job-dependencies

on: 
  workflow_dispatch:


jobs: 
  job-1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Job 1 has been run!" 
      - run: echo "This command run on the same environment" 

  job-2: 
    runs-on: ubuntu-latest
    steps:
      - run: echo "Job 2 ran on a different environment!"

  job-3: 
    runs-on: ubuntu-latest
    needs:
      - job-1
      - job-2
    steps:
      - run: echo "Job 3 depends on Job 1 and Job 2"

  job-4: 
    runs-on: ubuntu-latest
    needs:
      - job-3
      - job-2
    steps:
      - run: echo "This create a DAG" 


