name: Secrets & Variables demo
on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Show config
        run: |
          echo "App:  ${{ vars.APP_NAME }}"        # repo-level variable
          echo "URL:  ${{ vars.API_URL }}"         # environment variable
          echo "Pass: ${{ secrets.DB_PASSWORD }}"  # shows *** in log
      - name: Use secret safely
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Connecting to ${{ vars.API_URL }} (password length ${#DB_PASSWORD})"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    steps:
      - name: Show config
        run: |
          echo "App:  ${{ vars.APP_NAME }}"
          echo "URL:  ${{ vars.API_URL }}"
          echo "Pass: ${{ secrets.DB_PASSWORD }}"
